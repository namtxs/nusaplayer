name: ci

on:
  push:
    branches: main
    # paths-ignore:
    # - '**/*.md'
    # - 'examples/**/*.html'

env:
  CI: true
  PNPM_CACHE_FOLDER: .pnpm-store

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: load cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
          key: ${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}

      - uses: pnpm/action-setup@v4
        with:
          run_install: true

      - name: build packs
        run: |
          pnpm build:cache

      - name: run test
        run: |
          pnpm test
